<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="水贴工作台">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F0F12">
<meta name="description" content="BJD 娃脸水贴贴装与电子试妆：内置脸模、眉毛唇妆腮红实时预览与导出。">
<title>BJD 水贴工作台</title>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      /* 带版本号后缀：CDN 对 .js 是长缓存，换 URL 才能让已安装的 App 真正拉到新 SW */
      navigator.serviceWorker.register('sw.js?v=19').catch(() => {});
    });
  }
</script>
<style>
  :root{
    --accent:#0A84FF;
    --paper:#E8E7E3;
    --topbar:#141417;
    --panel:#0F0F12;
    --drawer:#0B0B0D;
    --field:#1A1A1E;
    --hairline:#232327;
    --txt:#EDEDEF;
    --txt-dim:#9A9AA0;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* 关键：禁止文档级滚动。移动端 100vh > 可视视口（多出地址栏高度），
     一旦原生对话框触发焦点 scrollIntoView，整个界面会被推到底且拖不回来。 */
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:#060607;
    font-family:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",sans-serif;
    color:var(--txt);
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  #app{
    width:100%;height:100%;position:relative;
    display:flex;flex-direction:column;
    background:var(--drawer);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    overflow:hidden;
  }
  @media (min-width:700px){
    body{display:grid;place-items:center;overflow:hidden}
    #app{
      width:390px;height:844px;
      border-radius:44px;overflow:hidden;
      box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px #1C1C20;
      padding-top:env(safe-area-inset-top);
    }
  }

  /* ---------- top bar ---------- */
  .topbar{
    height:52px;flex:none;display:flex;align-items:center;gap:2px;
    padding:0 8px;background:var(--topbar);border-bottom:1px solid var(--hairline);
  }
  .icon-btn{
    width:42px;height:42px;border:0;border-radius:12px;background:transparent;
    color:var(--txt);display:grid;place-items:center;cursor:pointer;padding:0;
  }
  .icon-btn:active{background:#232327}
  .icon-btn:disabled{color:#4A4A50;background:transparent;cursor:default}
  .icon-btn svg{width:22px;height:22px;display:block}
  .title{
    flex:1;text-align:center;font-size:14.5px;font-weight:500;color:var(--txt);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
    background:none;border:0;color:var(--txt);cursor:pointer;padding:6px 4px;
    font-family:inherit;
  }
  .title small{color:#8E8E94;font-weight:400}

  /* ---------- viewport ---------- */
  .viewport{flex:1;position:relative;background:var(--paper);overflow:hidden;min-height:120px}
  #stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .vp-pill{
    position:absolute;bottom:12px;z-index:5;
    background:rgba(22,22,25,.92);color:#fff;border:0;cursor:pointer;
    font-size:13px;font-weight:500;padding:9px 14px;border-radius:10px;
    font-family:inherit;letter-spacing:.1px;
  }
  .vp-pill:active{transform:scale(.97)}
  #resetBtn{left:12px}
  #guideBtn{right:12px;background:var(--accent)}
  #guideBtn.off{background:rgba(22,22,25,.92);color:#B9B9BF}

  /* ---------- bottom tool bar ---------- */
  .controls{
    flex:none;background:var(--panel);border-top:1px solid var(--hairline);z-index:20;position:relative;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:5px;
  }
  /* 无选中素材时只禁用「属性控件」（不透明度/混合/角度/翻转/步进），
     素材库与图层按钮必须始终可点，否则空画布下无法打开素材库 */
  .controls.disabled .crow > :not(.lib-btn){opacity:.38;pointer-events:none}
  /* 360px 窄屏也要放得下：gap 收紧、允许必要时换行兜底（不裁切），
     #stepVal 改为悬浮指示器不占行宽 */
  .crow{display:flex;align-items:center;gap:5px;position:relative;flex-wrap:wrap;min-width:0}
  .crow.top{min-height:34px}
  .lib-btn{
    flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;
    border-radius:9px;border:1px solid #2E2E33;background:var(--field);color:var(--txt);
    font-size:12.5px;font-family:inherit;cursor:pointer;
  }
  .lib-btn svg{width:14px;height:14px}
  .lib-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .lib-btn:active{opacity:.82}
  .lib-btn .cnt{font-family:var(--mono);font-size:11.5px;opacity:.9}
  .lbl{font-size:12px;color:#D8D8DA;white-space:nowrap}
  .lbl b{font-weight:400;color:var(--txt);font-family:var(--mono);font-size:12.5px}
  .max-lbl{display:none}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;
    margin:0;min-width:52px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:linear-gradient(to right,var(--accent) var(--fill,85%),#3A3A3F var(--fill,85%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:19px;height:19px;border-radius:50%;
    background:var(--accent);margin-top:-7.5px;border:none;
    box-shadow:0 1px 4px rgba(0,0,0,.45);
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3A3A3F}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;background:var(--accent);border:none}
  select.blend{
    appearance:none;-webkit-appearance:none;
    background:var(--field) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23B9B9BF' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 7px center;
    border:1px solid #2E2E33;border-radius:9px;height:32px;color:var(--txt);
    font-size:12px;font-family:inherit;padding:0 21px 0 7px;cursor:pointer;flex:none;
  }
  .angle-lbl{font-size:11.5px;color:#D8D8DA;white-space:nowrap}
  .angle-lbl b{font-weight:400;font-family:var(--mono);font-size:12px;color:var(--txt);display:inline-block;min-width:42px;text-align:right;margin-left:2px}
  .mini-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid #2E2E33;background:var(--field);
    color:var(--txt);display:grid;place-items:center;cursor:pointer;padding:0;flex:none;
  }
  .mini-btn:active{background:#26262B}
  .mini-btn svg{width:15px;height:15px}
  .step-btns{display:flex;gap:4px;margin-left:auto}
  .step-btn{
    width:27px;height:27px;border-radius:8px;border:1px solid #2E2E33;background:var(--field);
    color:#E5E5E7;font-size:12.5px;line-height:1;display:grid;place-items:center;cursor:pointer;
    font-family:var(--mono);padding:0;flex:none;
  }
  .step-btn:active{background:#26262B;border-color:#3A3A40}
  /* 悬浮在步进按钮上方，不占行宽（否则长按时会把行挤溢出） */
  #stepVal{
    position:absolute;right:0;bottom:calc(100% + 1px);
    font-family:var(--mono);font-size:11.5px;color:var(--accent);
    max-width:58px;text-align:center;opacity:0;transition:opacity .18s;pointer-events:none;
  }
  #stepVal.show{opacity:1}

  /* ---------- drawer (overlay sheet) ---------- */
  .drawer{
    position:absolute;left:0;right:0;bottom:var(--bar-h,86px);height:min(58%,470px);
    background:var(--drawer);border-top:1px solid var(--hairline);border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;z-index:50;
    transform:translateY(calc(100% + var(--bar-h,86px) + 24px));pointer-events:none;
    transition:transform .36s cubic-bezier(.32,.72,.33,1);
    box-shadow:0 -16px 44px rgba(0,0,0,.55);
  }
  .drawer.open{transform:translateY(0);pointer-events:auto}
  .dr-head{flex:none;position:relative;display:flex;align-items:center;gap:8px;padding:11px 12px 2px}
  .dr-head::before{
    content:"";position:absolute;left:50%;top:5px;transform:translateX(-50%);
    width:38px;height:4px;border-radius:2px;background:#3E3E45;
  }
  .dr-title{font-size:13.5px;font-weight:600;color:var(--txt)}
  .dr-x{
    margin-left:auto;width:28px;height:28px;border-radius:8px;border:0;background:var(--field);
    color:var(--txt-dim);font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0;
  }
  .drawer-scrim{
    position:absolute;left:0;right:0;top:0;bottom:var(--bar-h,86px);
    background:rgba(5,5,7,.5);z-index:45;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .drawer-scrim.on{opacity:1;pointer-events:auto}
  .tabs{display:flex;gap:6px;padding:6px 10px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:none;padding:7px 13px;border-radius:9px;border:0;cursor:pointer;
    background:#1D1D21;color:#DADADD;font-size:13px;font-family:inherit;white-space:nowrap;
  }
  .tab.active{background:var(--accent);color:#fff}
  .filters{display:flex;gap:2px;padding:0 8px 7px;flex:none}
  .filters.hidden{display:none}
  .chip{
    padding:5px 9px;border-radius:7px;border:0;background:transparent;cursor:pointer;
    color:var(--txt-dim);font-size:12px;font-family:inherit;letter-spacing:.2px;
  }
  .chip.active{background:var(--accent);color:#fff}
  .grid{
    flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);
    gap:8px;padding:2px 10px 14px;align-content:start;scrollbar-width:none;
  }
  .grid::-webkit-scrollbar{display:none}
  .card{background:transparent;border:0;padding:0;text-align:left;cursor:pointer;font-family:inherit}
  /* 缩略图统一用「透明棋盘格」浅底：导入的透明 PNG / 深色线条在深底上会完全看不见，
     改浅底后与实际画布（纸灰）观感一致，深浅素材都能看清。 */
  .thumb,.pico,.lthumb{
    background-color:#EAE9E5;
    background-image:
      linear-gradient(45deg,#DBDAD5 25%,transparent 25%,transparent 75%,#DBDAD5 75%),
      linear-gradient(45deg,#DBDAD5 25%,transparent 25%,transparent 75%,#DBDAD5 75%);
    background-size:12px 12px;
    background-position:0 0,6px 6px;
  }
  .thumb{
    height:56px;border-radius:10px;display:grid;place-items:center;
    overflow:hidden;border:1px solid transparent;
  }
  .card:active .thumb{border-color:var(--accent)}
  .thumb canvas,.thumb img{max-width:84%;max-height:80%;display:block}
  .cap{
    font-size:11px;color:#B9B9BF;margin:5px 0 0 2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card.import .thumb{border:1.4px dashed #3E3E45;background:transparent;color:#8A8A90;font-size:12px}
  .layer-list{flex:1;overflow-y:auto;padding:4px 10px 12px;scrollbar-width:none}
  .layer-list::-webkit-scrollbar{display:none}
  .lrow{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:11px;
    background:#16161A;margin-bottom:6px;cursor:pointer;border:1px solid transparent;
  }
  .lrow.sel{border-color:var(--accent)}
  .lrow .lthumb{width:58px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}
  .lrow .lthumb canvas{max-width:88%;max-height:84%}
  .lrow .lname{flex:1;font-size:12.5px;color:#D5D5DA;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lrow .lname i{display:block;font-style:normal;font-size:10.5px;color:#77777E;font-family:var(--mono);margin-top:1px}
  .lrow .sbtn{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:#B9B9BF;display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
  .lrow .sbtn.off{color:#55555C}
  .lrow .sbtn:active{background:#242429}
  .empty{color:#6E6E74;font-size:13px;text-align:center;padding:34px 24px;line-height:1.8}
  .empty b{color:#9A9AA0;font-weight:500;display:block;font-size:14px;margin-bottom:6px}
  .preset-row{
    grid-column:1 / -1;display:flex;align-items:center;gap:12px;
    background:#16161A;border:1px solid transparent;border-radius:12px;
    padding:11px 12px;cursor:pointer;font-family:inherit;color:var(--txt);text-align:left;
  }
  .preset-row:active{border-color:var(--accent)}
  .preset-row .pico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden}
  .preset-row .pico canvas{max-width:82%;max-height:70%}
  .preset-row .pico img{max-width:82%;max-height:72%;background:transparent;border-radius:6px}
  .preset-row .pmeta{flex:1;min-width:0}
  .preset-row .pname{font-size:13.5px;font-weight:500}
  .preset-row .pdesc{font-size:11.5px;color:#8A8A90;margin-top:2px}
  .ai-btn{
    position:absolute;right:12px;bottom:60px;width:44px;height:44px;border-radius:50%;
    background:rgba(24,24,28,.92);border:1px solid #2E2E33;color:var(--accent);
    display:grid;place-items:center;cursor:pointer;z-index:6;padding:0;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .ai-btn svg{width:21px;height:21px}
  .ai-btn:active{transform:scale(.94)}

  /* ---------- toast & sheet ---------- */
  .toast{
    position:absolute;left:50%;bottom:16px;transform:translate(-50%,8px);
    background:rgba(17,17,20,.94);color:#fff;font-size:13px;padding:9px 15px;
    border-radius:10px;opacity:0;transition:all .22s;pointer-events:none;z-index:40;
    white-space:nowrap;max-width:86%;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .sheet{position:absolute;inset:0;z-index:60;display:none}
  .sheet.open{display:block}
  .sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .sheet .panel{
    position:absolute;left:8px;right:8px;bottom:8px;background:#1C1C21;
    border-radius:18px;padding:14px 14px 12px;box-shadow:0 -8px 40px rgba(0,0,0,.5);
  }
  .sheet h3{margin:2px 4px 10px;font-size:15px;font-weight:600}
  .sheet .row{
    display:flex;align-items:center;gap:12px;width:100%;background:#26262B;border:0;
    border-radius:12px;padding:12px 12px;margin-bottom:8px;color:var(--txt);
    font-size:14px;font-family:inherit;cursor:pointer;text-align:left;
  }
  .sheet .row:active{background:#2E2E34}
  .sheet .row svg{width:20px;height:20px;color:var(--accent);flex:none}
  /* 导出面板：主标题 + 灰色副说明的两行行按钮 */
  .sheet .row .rt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sheet .row .rt b{font-size:14px;font-weight:500}
  .sheet .row .rt i{font-style:normal;font-size:11.5px;color:#8A8A90}
  .sheet .row:active .rt i{color:#A8A8B0}
  .sheet .cancel{background:transparent;color:#9A9AA0;justify-content:center}
  .sheet .panel{max-height:76%;overflow-y:auto}

  /* ---------- 三期：眼珠试戴 ---------- */
  /* 调参时尽量不遮脸：遮罩压到很淡，面板只占下半屏 */
  .sheet.eye .scrim{background:rgba(0,0,0,.20)}
  .sheet.eye .panel{max-height:54%}
  .eye-sw{display:flex;gap:9px;flex-wrap:wrap;margin:0 4px 12px}
  .eye-sw button{
    width:30px;height:30px;border-radius:50%;border:2px solid #3A3A42;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .eye-sw button.on{border-color:#fff;transform:scale(1.08)}
  .eye-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;margin:0 4px 12px}
  .eye-f{display:flex;flex-direction:column;gap:3px;min-width:0}
  .eye-f>span{font-size:11.5px;color:#9A9AA2;display:flex;justify-content:space-between;gap:6px}
  .eye-f>span b{color:#7FC4FF;font-family:var(--mono);font-weight:500;font-size:11.5px}
  .eye-f input[type=range]{-webkit-appearance:none;appearance:none;height:20px;background:transparent;width:100%;margin:0}
  .eye-f input[type=range]::-webkit-slider-runnable-track{height:3px;background:#33333B;border-radius:3px}
  .eye-f input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#0A84FF;margin-top:-6px;box-shadow:0 0 0 3px rgba(10,132,255,.16);
  }
  .eye-actions{display:flex;gap:8px;margin:0 4px}
  .eye-actions button{
    flex:1;height:38px;border-radius:11px;border:0;font-family:inherit;font-size:12.5px;
    cursor:pointer;background:#26262B;color:var(--txt);white-space:nowrap;padding:0 6px;
  }
  .eye-actions button.on{background:var(--accent);color:#fff}
  .eye-actions button.eye-del{color:#FF7A7A}
  .eye-actions button:disabled{opacity:.4}
  /* v13：眼孔底色行 */
  .eye-bgrow{display:flex;align-items:center;gap:8px;margin:0 4px 12px}
  .eye-bgrow>span{font-size:11.5px;color:#9A9AA2;flex:none}
  .eye-bgsw{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .eye-bgsw button{
    width:22px;height:22px;border-radius:50%;border:2px solid #3A3A42;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
  }
  .eye-bgsw button.on{border-color:#fff;transform:scale(1.1)}
  .eye-bgpick{position:relative;width:26px;height:26px;flex:none}
  .eye-bgpick input[type=color]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:0}
  .eye-bgpick::before{
    content:'';position:absolute;inset:2px;border-radius:50%;
    background:conic-gradient(#f44,#fa0,#ff4,#4c4,#48f,#84f,#f44);
    -webkit-mask:radial-gradient(circle,transparent 34%,#000 36%);
            mask:radial-gradient(circle,transparent 34%,#000 36%);
  }
  .card.on .thumb{border-color:var(--accent)}
  /* 眼珠按钮放在顶行（那里有不透明度滑杆可以伸缩），
     绝不放在第二行——否则会撑高控制栏，画布变矮、脸模位移，眼珠就脱位了 */
  #eyeBtn{width:30px;height:30px}
  .saved-lbl{font-size:11.5px;color:#8A8A90;margin:-4px 4px 8px;font-family:var(--mono)}
  .saved-lbl.ok{color:var(--accent)}
  .saved-lbl.warn{color:#E0A33A}
  .proj-list{margin:2px 0 8px}
  .proj-row{
    display:flex;align-items:center;gap:10px;width:100%;background:#26262B;border:0;
    border-radius:12px;padding:10px 10px;margin-bottom:6px;color:var(--txt);
    font-size:13.5px;font-family:inherit;cursor:pointer;text-align:left;
  }
  .proj-row.cur{outline:1px solid var(--accent)}
  .proj-row .pmeta{flex:1;min-width:0}
  .proj-row .pname{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .proj-row .psub{font-size:11px;color:#8A8A90;font-family:var(--mono);margin-top:2px}
  .proj-row .pact{
    flex:none;width:30px;height:30px;border-radius:8px;border:1px solid #33333A;background:#1F1F24;
    color:#C8C8CE;display:grid;place-items:center;cursor:pointer;padding:0;
  }
  .proj-row .pact svg{width:15px;height:15px}
  .proj-row .pact:active{background:#2E2E34}

  /* ---------- group splitter（整组图自动分割） ---------- */
  .splitter{
    position:absolute;inset:0;z-index:80;background:var(--panel);
    display:none;flex-direction:column;
  }
  .splitter.open{display:flex}
  .sp-head{flex:none;display:flex;align-items:center;gap:6px;padding:10px 10px 8px;border-bottom:1px solid var(--hairline)}
  .sp-title{flex:1;text-align:center;font-size:14.5px;font-weight:600;letter-spacing:.2px}
  .sp-x,.sp-ok{border:0;background:transparent;color:var(--txt-dim);font-family:inherit;font-size:14px;cursor:pointer;padding:6px 6px}
  .sp-ok{color:var(--accent);font-weight:500}
  .sp-banner{
    flex:none;margin:8px 10px 0;padding:8px 10px;border-radius:10px;
    background:rgba(10,132,255,.13);color:#9CCBFF;font-size:12px;font-family:var(--mono);
  }
  .sp-stage{flex:1;margin:10px;min-height:0;display:grid;place-items:center;overflow:hidden}
  .sp-sheet{position:relative;background:var(--paper);border-radius:10px;overflow:hidden;touch-action:none}
  .sp-sheet img{width:100%;height:100%;display:block}
  .sp-boxes{position:absolute;inset:0}
  .sp-box{
    position:absolute;border:1.5px solid var(--accent);background:rgba(10,132,255,.14);
    border-radius:4px;touch-action:none;cursor:move;
  }
  .sp-box.sel{border-width:2.5px;background:rgba(10,132,255,.22)}
  .sp-box.off{opacity:.26;border-style:dashed}
  .sp-box b{
    position:absolute;top:-16px;left:-1px;font-size:10px;font-weight:400;font-family:var(--mono);
    color:#fff;background:var(--accent);padding:1px 4px;border-radius:4px;white-space:nowrap;pointer-events:none;
  }
  .sp-box .rh{
    position:absolute;right:-7px;bottom:-7px;width:15px;height:15px;border-radius:50%;
    background:var(--accent);border:2px solid var(--panel);display:none;touch-action:none;
  }
  .sp-box .dx{
    position:absolute;right:-8px;top:-8px;width:17px;height:17px;border-radius:50%;background:#E0483C;
    border:2px solid var(--panel);color:#fff;font-size:9px;line-height:1;display:none;place-items:center;touch-action:none;
  }
  .sp-box.sel .rh,.sp-box.sel .dx{display:grid}
  .sp-chips{flex:none;display:flex;gap:6px;overflow-x:auto;padding:2px 10px 8px;scrollbar-width:none}
  .sp-chips::-webkit-scrollbar{display:none}
  .sp-chip{
    flex:none;display:flex;align-items:center;gap:6px;background:#26262B;border:0;border-radius:9px;
    padding:7px 9px;color:var(--txt);font-size:12.5px;font-family:inherit;cursor:pointer;white-space:nowrap;
  }
  .sp-chip.off{color:#6E6E74;background:#191A1E;text-decoration:line-through}
  .sp-chip .ren{width:16px;height:16px;color:#8A8A90;display:grid;place-items:center;font-size:11px}
  .sp-ctl{flex:none;padding:0 10px 12px}
  .sp-row{display:flex;gap:8px;margin-top:6px}
  .sp-btn{
    flex:1;background:#26262B;border:0;border-radius:11px;padding:10px 8px;
    color:var(--txt);font-size:13px;font-family:inherit;cursor:pointer;
  }
  .sp-btn:active{background:#2E2E34}
  .sp-btn.pri{background:var(--accent);color:#fff}
  .sp-num{flex:1;font-size:11.5px;color:#8A8A90;font-family:var(--mono);text-align:center;padding:4px 0 0}
  .grp-del{
    flex:none;width:32px;height:32px;border-radius:9px;border:0;background:transparent;
    color:#8A8A90;display:grid;place-items:center;cursor:pointer;padding:0;
  }
  .grp-del:active{background:#2E2E34}

  /* ---------- 内联命名/确认面板（替代原生 prompt/confirm） ---------- */
  .ask{
    position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.55);padding:0 24px;
  }
  .ask.open{display:flex}
  .ask .card{
    width:100%;max-width:300px;background:#1C1C20;border-radius:16px;padding:16px 16px 12px;
    box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px #2A2A31;
  }
  .ask h4{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:.2px}
  .ask p{margin:0 0 14px;font-size:12.5px;color:#9A9AA2;line-height:1.55}
  .ask input{
    width:100%;height:38px;border-radius:10px;border:1px solid #34343C;background:#121215;
    color:var(--txt);font-size:14.5px;font-family:inherit;padding:0 10px;outline:none;
    user-select:text;-webkit-user-select:text;caret-color:var(--accent);
  }
  .ask input:focus{border-color:var(--accent)}
  .ask .btns{display:flex;gap:8px;margin-top:14px}
  .ask .b{
    flex:1;height:38px;border:0;border-radius:10px;background:#26262B;color:var(--txt);
    font-size:14px;font-family:inherit;cursor:pointer;
  }
  .ask .b:active{background:#2E2E34}
  .ask .b.pri{background:var(--accent);color:#fff;font-weight:500}
  /* Dock controls below the canvas, never over it. */
  #app.eye-tuning #controls,#app.edge-editing #controls{display:none}
  #app.eye-tuning #drawer,#app.eye-tuning #drawerScrim{visibility:hidden}
  #eyeSheet{position:relative;inset:auto;flex:none;z-index:20;max-height:46%;overflow:auto}
  #eyeSheet .scrim{display:none}
  #eyeSheet .panel{position:relative;inset:auto;margin:0;border-radius:16px 16px 0 0;max-height:none;box-shadow:none;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  #edgePanel{flex:none;background:#1C1C21;padding:12px;max-height:42%;overflow:auto}
  #edgePanel[hidden]{display:none}
  .edit-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .edit-heading button,.edit-row button{background:#303037;color:#eee;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit}
  .edit-row{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px}
  .edit-row input{flex:1;min-width:0}.edit-row output{min-width:36px}
  .edit-row button[aria-pressed="true"]{background:#0788ff}
  .edit-row button:disabled{opacity:.35}
  #edgePanel p{font-size:11px;color:#bbb;margin:0}
</style>
<link rel="stylesheet" href="ui-layout.css?v=3">
</head>
<body>
<div id="app" data-screen-label="editor">

  <!-- ======== top bar ======== -->
  <header class="topbar">
    <button class="icon-btn" id="undoBtn" title="撤销" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5.5 4 10l4.5 4.5"/><path d="M4 10h9.2a6 6 0 0 1 0 12H9"/></svg>
    </button>
    <button class="icon-btn" id="redoBtn" title="重做" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 5.5 20 10l-4.5 4.5"/><path d="M20 10h-9.2a6 6 0 0 0 0 12H15"/></svg>
    </button>
    <button class="title" id="projectBtn">素头：V6-H <small id="projName">/ 方案：春日</small></button>
    <button class="icon-btn" id="compareBtn" title="长按对比">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3a9 9 0 0 1 9 9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="icon-btn" id="exportBtn" title="导出 PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m8 8 4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
    </button>
  </header>

  <!-- ======== viewport ======== -->
  <div class="viewport" id="viewport">
    <canvas id="stage"></canvas>
    <button class="vp-pill" id="resetBtn">100% 视角复位</button>
    <button class="vp-pill" id="guideBtn">辅助线：开</button>
    <div class="toast" id="toast"></div>
  </div>

  <!-- ======== bottom tool bar ======== -->
  <div class="controls" id="controls">
    <div class="crow top">
      <button class="lib-btn primary" id="libBtn" title="打开素材库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg>
        素材库
      </button>
      <button class="lib-btn" id="layerBtn" title="图层">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4 20 8.5 12 13 4 8.5Z"/><path d="m4 13.5 8 4.5 8-4.5" opacity=".6"/></svg>
        图层 <span class="cnt" id="layerCnt">0</span>
      </button>
      <button class="mini-btn" id="eyeBtn" title="眼珠微调" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><circle cx="10.9" cy="10.9" r="1" fill="#fff" stroke="none"/></svg>
      </button>
      <input type="range" id="opSlider" min="0" max="100" value="85" title="不透明度">
      <span class="lbl"><b id="opVal">85%</b></span>
    </div>
    <div class="crow">
      <select class="blend" id="blendSel" title="图层混合">
        <option value="multiply" selected>正片叠底</option>
        <option value="source-over">正常</option>
        <option value="overlay">叠加</option>
        <option value="screen">滤色</option>
        <option value="soft-light">柔光</option>
        <option value="darken">变暗</option>
      </select>
      <span class="angle-lbl">角度<b id="angVal">-2.5&deg;</b></span>
      <button class="mini-btn" id="flipBtn" title="镜像翻转">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2.5 3"/><path d="M9 8 5 12l4 4V8Z" fill="currentColor" stroke="none"/><path d="m15 8 4 4-4 4V8Z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="mini-btn" id="pairBtn" title="镜像复制成对（左右对称）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2.5 3"/><rect x="3.5" y="8.5" width="6" height="7" rx="1.2" fill="currentColor" stroke="none" opacity=".95"/><rect x="14.5" y="8.5" width="6" height="7" rx="1.2" fill="currentColor" stroke="none" opacity=".95"/></svg>
      </button>
      <span id="stepVal"></span>
      <div class="step-btns">
        <button class="step-btn" id="angMinus" title="角度 -0.1&deg;">&minus;</button>
        <button class="step-btn" id="angPlus" title="角度 +0.1&deg;">+</button>
        <button class="step-btn" id="nudgeLeft" title="左移 0.5px">&#9664;</button>
        <button class="step-btn" id="nudgeUp" title="上移 0.5px">&#9650;</button>
        <button class="step-btn" id="nudgeDown" title="下移 0.5px">&#9660;</button>
        <button class="step-btn" id="nudgeRight" title="右移 0.5px">&#9654;</button>
      </div>
    </div>
  </div>

  <!-- ======== asset drawer (overlay) ======== -->
  <div class="drawer-scrim" id="drawerScrim"></div>
  <div class="drawer" id="drawer">
    <div class="dr-head">
      <span class="dr-title" id="drTitle">素材库</span>
      <button class="dr-x" id="drawerClose" title="收起">&#10005;</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
    <div class="layer-list" id="layerList" style="display:none"></div>
    <button class="ai-btn" id="aiBtn" title="AI 锚点">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.6 3.9 2.6 6.4 6.6 7-4 .7-6 3.1-6.6 7-.6-3.9-2.6-6.3-6.6-7 4-.6 6-3.1 6.6-7Z"/><path d="M19 14.5c.3 2 1.3 3.2 3.3 3.5-2 .4-3 1.6-3.3 3.5-.3-1.9-1.3-3.1-3.3-3.5 2-.3 3-1.5 3.3-3.5Z" opacity=".75"/></svg>
    </button>
  </div>

  <!-- ======== export sheet ======== -->
  <div class="sheet" id="expSheet">
    <div class="scrim" id="expScrim"></div>
    <div class="panel">
      <h3>导出</h3>
      <button class="row" id="expAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 15.5 9 10l4 4 3-3 4.5 4.5"/></svg>
        <span class="rt"><b>整幅预览图</b><i>含脸模与所有水贴 · 2x 高清</i></span>
      </button>
      <button class="row" id="expDecalOnly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18" opacity=".28"/><path d="M6.5 15.5c3-1.6 5.5-2.4 11-2.4"/><path d="M7 9.5c3-1.6 5.5-2.4 10.5-2.4"/></svg>
        <span class="rt"><b>仅妆面 · 透明底</b><i>只有水贴、无脸模 · 可直接送印</i></span>
      </button>
      <button class="row" id="expPair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2.5 3"/><rect x="3.5" y="8.5" width="6" height="7" rx="1.2"/><rect x="14.5" y="8.5" width="6" height="7" rx="1.2"/></svg>
        <span class="rt"><b>成对水贴板</b><i>每个部件单独成图、左右对称拼版</i></span>
      </button>
      <button class="row" id="expCancel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        <span class="rt"><b>取消</b><i>返回画布</i></span>
      </button>
    </div>
  </div>

  <!-- ======== eye try-on sheet ======== -->
  <div class="sheet eye" id="eyeSheet">
    <div class="scrim" id="eyeScrim"></div>
    <div class="panel">
      <div class="edit-heading"><h3>眼珠微调</h3><button id="eyeDone">完成</button></div>
      <div class="eye-sw" id="eyeSw"></div>
      <div class="eye-bgrow" id="eyeBgRow" title="自定义眼珠模式下，眼孔后透出的颜色">
        <span>眼孔底色</span>
        <div class="eye-bgsw" id="eyeBgSw"></div>
        <label class="eye-bgpick"><input type="color" id="eyeBgPick" value="#0A0A0C"></label>
      </div>
      <div class="eye-grid">
        <label class="eye-f"><span>缩放 <b id="evSize">1.00</b></span><input type="range" id="erSize" min="0.62" max="1.12" step="0.01" value="1"></label>
        <label class="eye-f" data-vec><span>瞳孔 <b id="evPupil">0.27</b></span><input type="range" id="erPupil" min="0.14" max="0.46" step="0.01" value="0.27"></label>
        <label class="eye-f" data-vec><span>露度 <b id="evExp">0.00</b></span><input type="range" id="erExp" min="-0.30" max="0.30" step="0.01" value="0"></label>
        <label class="eye-f" data-vec><span>视线 <b id="evGaze">0.00</b></span><input type="range" id="erGaze" min="-0.30" max="0.30" step="0.01" value="0"></label>
        <label class="eye-f"><span>眼距 <b id="evGap">0</b></span><input type="range" id="erGap" min="-26" max="26" step="1" value="0"></label>
        <label class="eye-f" data-vec><span>高光 <b id="evHl">215&deg;</b></span><input type="range" id="erHl" min="0" max="360" step="5" value="215"></label>
        <label class="eye-f" data-vec><span>血丝 <b id="evVein">25%</b></span><input type="range" id="erVein" min="0" max="1" step="0.05" value="0.25"></label>
        <label class="eye-f" data-vec><span>眼泥影 <b id="evPutty">50%</b></span><input type="range" id="erPutty" min="0" max="1" step="0.05" value="0.5"></label>
      </div>
      <div class="eye-actions">
        <button id="eyeSyncBtn" class="on">左右同步：开</button>
        <button id="eyeRealignBtn">复位眼窝</button>
        <button id="eyeRemoveBtn" class="eye-del">移除眼珠</button>
      </div>
    </div>
  </div>

  <section id="edgePanel" hidden aria-label="眼眶手动修边">
    <div class="edit-heading"><strong>眼眶手动修边</strong><button id="edgeDone">完成</button></div>
    <p>蓝色是抠空区域 · 每一笔均可撤销 · 双指缩放</p>
    <div class="edit-row">
      <button data-edge-tool="erase" aria-pressed="true">擦除</button>
      <button data-edge-tool="restore" aria-pressed="false">恢复</button>
      <button data-edge-tool="move" aria-pressed="false">移动</button>
      <button id="edgeZoomOut" aria-label="缩小画布">−</button><button id="edgeZoomIn" aria-label="放大画布">＋</button>
    </div>
    <label class="edit-row">笔刷 <input id="edgeSize" type="range" min="2" max="60" value="14"><output id="edgeSizeValue">14px</output></label>
    <div class="edit-row"><button id="edgeUndo">撤销</button><button id="edgeRedo">重做</button></div>
  </section>
  <!-- ======== project sheet ======== -->
  <div class="sheet" id="sheet">
    <div class="scrim" id="sheetScrim"></div>
    <div class="panel">
      <h3>素头与底图</h3>
      <button class="row" id="embedDefaultBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 9.5 8l3.5 6 2.5-3.5L20 17.5Z"/><path d="M3 4.5h18v15H3z" opacity=".35"/></svg>
        默认脸模
      </button>
      <button class="row" id="embedAnanBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c4.4 0 7.5 3.2 7.5 7.7 0 5.1-3.4 9.3-7.5 9.3s-7.5-4.2-7.5-9.3c0-4.5 3.1-7.7 7.5-7.7Z"/><path d="M8.8 12.4h.01M15.2 12.4h.01" stroke-width="2.4"/></svg>
        默认脸模-安安
      </button>
      <button class="row" id="uploadBaseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="m21 16-4.2-4.2a1.5 1.5 0 0 0-2.1 0L8 18.5"/></svg>
        上传素头底图…
      </button>
      <button class="row" id="redetectEyesBtn">重新识别当前眼窝</button>
      <button class="row" id="editEdgesBtn">手动修边（擦除／恢复）</button>
      <button class="row" id="clearEyesBtn">清除眼孔（可撤销）</button>
      <button class="row" id="pickEyeBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>
        点选眼窝（自动没认出时用）
      </button>
      <button class="row" id="centerBaseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M12 4.6v2M12 17.4v2M4.6 12h2M17.4 12h2"/></svg>
        自动居中脸壳
      </button>
      <button class="row" id="adjBaseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v17M3.5 12h17"/><path d="M9 6.5 12 3.5l3 3M9 17.5l3 3 3-3M6.5 9 3.5 12l3 3M17.5 9l3 3-3 3"/></svg>
        手动调整底图（拖动/双指缩放）
      </button>
      <button class="row" id="resetBaseBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.6-5.7"/><path d="M4.2 4.6v4.2h4.2"/></svg>
        底图位置复位

/* ---------------- tapered-stroke geometry helper ---------------- */
function cubic(p0, p1, p2, p3, t) {
  const mt = 1 - t;
  return [
    mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0],
    mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1]
  ];
}
/* pts: array of [x,y,w] — builds a filled closed outline along the spine */
function taperOutline(pts) {
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++) {
    const [x, y, w] = pts[i];
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len, hw = w / 2;
    L.push([x + nx * hw, y + ny * hw]);
    R.push([x - nx * hw, y - ny * hw]);
  }
  const path = new Path2D();
  path.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < L.length; i++) path.lineTo(L[i][0], L[i][1]);
  for (let i = R.length - 1; i >= 0; i--) path.lineTo(R[i][0], R[i][1]);
  path.closePath();
  return path;
}
/* sample a cubic bezier into spine points with width profile fn(t) */
function spine(p0, p1, p2, p3, wfn, n = 64) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const [x, y] = cubic(p0, p1, p2, p3, t);
    out.push([x, y, Math.max(0.4, wfn(t))]);
  }
  return out;
}
function smallStroke(p0, p1, w0, w1, n = 18) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    out.push([p0[0] + (p1[0] - p0[0]) * t, p0[1] + (p1[1] - p0[1]) * t, w0 + (w1 - w0) * t]);
  }
  return out;
}

/* ---------------- decal asset library ---------------- */
/* every asset: {id, tab, cat, name, w, h, kind, draw(ctx, color)} */
function browDraw(spinePts, extra) {
  return (ctx, color) => {
    ctx.fillStyle = color;
    ctx.fill(taperOutline(spinePts));
    if (extra) for (const e of extra) ctx.fill(taperOutline(e));
  };
}

function lashesFrom(base, count, dn, dd, w0, w1, arcK) {
  const out = [];
  for (let k = 0; k < count; k++) {
    const t = 0.12 + k * (0.76 / Math.max(1, count - 1));
    const [x, y] = cubic(base[0], base[1], base[2], base[3], t);
    const bell = Math.sin(Math.PI * t);
    const len = dn + dd * bell;
    out.push(smallStroke([x, y], [x + arcK * (0.5 - t) * 26, y + len], w0, w1));
  }
  return out;
}

/* ---------------- 电子妆容：柔光渲染基元 ----------------
   blushGlow —— 多瓣柔光腮红/高光：n 层不同半径与偏心叠加，
   边缘靠多层透明衰减自然消散（单层 radial 会有可见的"光晕边界"），
   再叠微颗粒做皮肤呼吸感；boost > 0 时加 additive 高光斑。
   注意：base 色相 lightness 取 58-64%，靠叠加出浓度，直接给深色会脏。 */
function blushGlow(ctx, cx, cy, rx, ry, hsl, o = {}) {
  const lobes = o.lobes || 3, grain = o.grain === undefined ? 0.05 : o.grain;
  const boost = o.boost || 0, k = (ry || rx) / rx;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  for (let i = 0; i < lobes; i++) {
    const t = i / (lobes - 1 || 1);
    const r = 1 - t * 0.42, al = 0.62 - t * 0.30;
    const ox = (t - 0.5) * rx * 0.30, oy = (t - 0.5) * rx * k * 0.24;
    const gx = cx + ox, gy = cy + oy;
    const g = ctx.createRadialGradient(gx, gy, r * rx * 0.05, gx, gy, r * rx);
    g.addColorStop(0, `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,${al})`);
    g.addColorStop(0.42, `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,${al * 0.52})`);
    g.addColorStop(0.74, `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,${al * 0.16})`);
    g.addColorStop(1, `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,0)`);
    ctx.save();
    ctx.translate(gx, gy); ctx.scale(1, k); ctx.translate(-gx, -gy);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(gx, gy, r * rx, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  if (grain > 0) {
    const rnd = mulberry(1337);
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,${grain})`;
    for (let i = 0; i < 170; i++) {
      const a = rnd() * Math.PI * 2, d = Math.sqrt(rnd()) * rx * 0.80;
      ctx.beginPath(); ctx.arc(cx + Math.cos(a) * d, cy + Math.sin(a) * d * k, 1.1 + rnd() * 1.3, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (boost > 0) {
    ctx.globalCompositeOperation = 'screen';
    const hx = cx - rx * 0.22, hy = cy - rx * k * 0.30;
    const g2 = ctx.createRadialGradient(hx, hy, 2, hx, hy, rx * 0.52);
    g2.addColorStop(0, `hsla(${hsl[0]},60%,86%,${boost})`);
    g2.addColorStop(1, `hsla(${hsl[0]},60%,86%,0)`);
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(hx, hy, rx * 0.52, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
/* 确定性伪随机：保证每次重绘颗粒图案一致，不会因重渲染而"闪" */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* 修容带：沿路径 stamp 柔雾点，硬度 hardness 控制衰减（越小越雾）
   同样靠重叠累积出层次，所以用浅棕 lightness 56-60% + 低流量 */
function contourBand(ctx, pts, size, hardness, hue) {
  const flow = 0.09;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  for (let i = 0; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const n = Math.max(1, Math.round(dist / Math.max(2, size * 0.16)));
    for (let k = 0; k <= n; k++) {
      const t = k / n, x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
      const g = ctx.createRadialGradient(x, y, size * hardness * 0.42, x, y, size * 1.05);
      g.addColorStop(0, `hsla(${hue[0]},${hue[1]}%,${hue[2]}%,${flow})`);
      g.addColorStop(0.55, `hsla(${hue[0]},${hue[1]}%,${hue[2]}%,${flow * 0.40})`);
      g.addColorStop(1, `hsla(${hue[0]},${hue[1]}%,${hue[2]}%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, size * 1.05, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}
/* 竖向柔光柱：鼻梁高光用，上窄下宽更好看 */
function glowDot(ctx, cx, y0, y1, size, hue, alpha) {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let y = y0; y <= y1; y += size * 0.22) {
    const t = (y - y0) / (y1 - y0);
    const w = size * (0.72 + t * 0.62);
    const a = alpha * (1 - Math.abs(t - 0.34) * 1.15);
    if (a <= 0) continue;
    const g = ctx.createRadialGradient(cx, y, 1, cx, y, w);
    g.addColorStop(0, `hsla(${hue[0]},${hue[1]}%,${hue[2]}%,${a})`);
    g.addColorStop(1, `hsla(${hue[0]},${hue[1]}%,${hue[2]}%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, y, w, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

    if (!asset) continue;
    const lx0 = wx - d.x, ly0 = wy - d.y;
    const cos = Math.cos(-d.rot), sin = Math.sin(-d.rot);
    let lx = lx0 * cos - ly0 * sin, ly = lx0 * sin + ly0 * cos;
    if (d.f) lx = -lx;
    const hw = asset.w / 2 * d.s, hh = asset.h / 2 * d.s;
    /* generous padding so grabbing the thin brow is easy */
    if (Math.abs(lx) <= hw + 6 && Math.abs(ly) <= hh + 10) {
      /* alpha check for precision (skip for soft / virtual assets) */
      if (asset.kind !== 'blush' && asset.kind !== 'custom' && asset.kind !== 'eye') {
        const img = decalCanvasOf(asset);
        const px = clamp(Math.floor((lx / d.s / asset.w + 0.5) * img.width), 0, img.width - 1);
        const py = clamp(Math.floor((ly / d.s / asset.h + 0.5) * img.height), 0, img.height - 1);
        const a = img.getContext('2d').getImageData(px, py, 1, 1).data[3];
        if (a < 18 && (Math.abs(lx) > hw || Math.abs(ly) > hh)) continue;
      }
      return d;
    }
  }
  return null;
}

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  const p = canvasPos(e);
  pointers.set(e.pointerId, p);

  if (pickEye) {                       // v13b：点选眼窝模式 —— 吃掉一切手势
    if (pointers.size === 1) handlePickEye(s2wX(p.x), s2wY(p.y));
    return;
  }
  if (baseAdj) {                       // v13c：手动调整底图 —— 拖动/双指缩放
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      mode = 'baseAdjZoom';
      gest = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: baseZoom };
      return;
    }
    commit();mode = 'baseAdj';
    gest = { sx: p.x, sy: p.y, opx: baseOff.px, opy: baseOff.py, s: baseFit().s };
    return;
  }

  if (pointers.size === 2) { // begin pinch
    const [a, b] = [...pointers.values()];
    mode = 'pinch';
    gest = {
      d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
      z0: view.z,
      c0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      v0: { ...view },
    };
    return;
  }
  const d = sel();
  if (d) {
    const btn = hitButton(d, p);
    if (btn === 'del') { removeDecal(d.id); toast('水贴已删除'); return; }
    if (btn === 'mirror') { d.f = !d.f; commit(); syncControls(); flashStep('已镜像'); return; }
    if (btn === 'rotate') {
      mode = 'rotate';
      const cx = w2sX(d.x), cy = w2sY(d.y);
      gest = { cx, cy, r0: d.rot, a0: Math.atan2(p.y - cy, p.x - cx) - d.rot, changed: false };
      return;
    }
    if (btn === 'resize') {
      mode = 'scale';
      const cx = w2sX(d.x), cy = w2sY(d.y);
      gest = { cx, cy, s0: d.s, d0: Math.hypot(p.x - cx, p.y - cy) || 1, changed: false };
      return;
    }
    if (hitDot(d, p)) {
      mode = 'scale';
      const cx = w2sX(d.x), cy = w2sY(d.y);
      gest = { cx, cy, s0: d.s, d0: Math.hypot(p.x - cx, p.y - cy) || 1, changed: false };
      return;
    }
  }
  const hit = hitDecal(p);
  if (hit) {
    if (selectedId !== hit.id) { selectedId = hit.id; syncControls(); renderLayers(); }
    mode = 'move';
    gest = { ox: s2wX(p.x) - hit.x, oy: s2wY(p.y) - hit.y, changed: false };
  } else {
    mode = 'pan';
    gest = { sx: p.x, sy: p.y, tx0: view.tx, ty0: view.ty, moved: false };
  }
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const p = canvasPos(e);
  pointers.set(e.pointerId, p);

  if (mode === 'baseAdjZoom' && pointers.size >= 2 && gest) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    baseZoom = clamp(gest.z0 * dist / gest.d0, 0.4, 3);
    reanchorEyes();
    requestRender();
    return;
  }
  if (mode === 'baseAdj' && gest) {
    baseOff.px = gest.opx + (p.x - gest.sx) / view.z / gest.s;
    baseOff.py = gest.opy + (p.y - gest.sy) / view.z / gest.s;
    reanchorEyes();
    requestRender();
    return;
  }
  if (mode === 'pinch' && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const nz = clamp(gest.v0.z * dist / gest.d0, 0.5, 5);
    /* keep pinch midpoint stable */
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    view.z = nz;
    view.tx = mx - (gest.c0.x - gest.v0.tx) * (nz / gest.v0.z);
    view.ty = my - (gest.c0.y - gest.v0.ty) * (nz / gest.v0.z);
    requestRender();
    return;
  }
  const d = sel();
  if (mode === 'move' && d && gest) {
    const wx = s2wX(p.x), wy = s2wY(p.y);
    d.x = wx - gest.ox; d.y = wy - gest.oy;
    if (isEyeDecal(d)) { if (!d.e) d.e = {}; d.e.manual = true; }
    const cwx = centerWorldX();
    if (Math.abs(d.x - cwx) < 8 / view.z) {
      d.x = cwx;
      snapFlashUntil = performance.now() + 450;
    }
    gest.changed = true;
    requestRender();
  } else if (mode === 'rotate' && d && gest) {
    let rot = Math.atan2(p.y - gest.cy, p.x - gest.cx) - gest.a0;
    const snap15 = Math.round(rot / (15 * RAD)) * 15 * RAD;
    if (Math.abs(rot - snap15) < 3.4 * RAD) rot = snap15;
    d.rot = rot;
    if (isEyeDecal(d)) { if (!d.e) d.e = {}; d.e.manual = true; }
    const delta = (rot - gest.r0) * DEG;
    showStep((delta >= 0 ? '+' : '') + delta.toFixed(1) + '\u00B0');
    $('#angVal').textContent = fmtDeg(d.rot);
    gest.changed = true;
    requestRender();
  } else if (mode === 'scale' && d && gest) {
    const dist = Math.hypot(p.x - gest.cx, p.y - gest.cy) || 1;
    d.s = clamp(gest.s0 * dist / gest.d0, 0.12, 6);
    showStep('\u00D7' + d.s.toFixed(2));
    gest.changed = true;
    requestRender();
  } else if (mode === 'pan' && gest) {
    view.tx = gest.tx0 + (p.x - gest.sx);
    view.ty = gest.ty0 + (p.y - gest.sy);
    if (Math.hypot(p.x - gest.sx, p.y - gest.sy) > 4) gest.moved = true;
    requestRender();
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (mode === 'pinch') {
    mode = pointers.size === 1 ? 'pan' : null;
    const rem = [...pointers.values()][0];
    if (rem) gest = { sx: rem.x, sy: rem.y, tx0: view.tx, ty0: view.ty, moved: true };
    return;
  }
  if (mode === 'pan' && gest && !gest.moved) {
    const p = { x: gest.sx, y: gest.sy };
    if (!hitDecal(p)) { selectedId = null; syncControls(); renderLayers(); }
  }
  if ((gest && gest.changed) || mode === 'baseAdj' || mode === 'baseAdjZoom') commit();
  const d = sel();
  if (d) $('#angVal').textContent = fmtDeg(d.rot);
  hideStepSoon();
  mode = null; gest = null;
  scheduleSave();
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const p = canvasPos(e);
  const nz = clamp(view.z * (e.deltaY < 0 ? 1.12 : 1 / 1.12), 0.5, 5);
  view.tx = p.x - (p.x - view.tx) * (nz / view.z);
  view.ty = p.y - (p.y - view.ty) * (nz / view.z);
  view.z = nz;
  requestRender();
  scheduleSave();
}, { passive: false });

function fmtDeg(rot) {
  let deg = rot * DEG;
  if (Math.abs(deg) < 0.05) deg = 0;
  return (deg > 0 ? '+' : '') + deg.toFixed(1) + '\u00B0';
}

function bindHold(el, fn) {
  let t1 = null, t2 = null, touched = false;
  const start = e => {
    e.preventDefault();
    touched = true; fn();
    t1 = setTimeout(() => { t2 = setInterval(fn, 90); }, 420);
  };
  const stop = () => {
    if (!touched) return;
    touched = false;
    clearTimeout(t1); clearInterval(t2);
    commit();
  };
  el.addEventListener('pointerdown', start);
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, stop));
  el.addEventListener('click', e => e.preventDefault());
  el.addEventListener('contextmenu', e => e.preventDefault());
}

function downloadCanvas(c, name) {
  c.toBlob(blob => {
    if (!blob) { toast('导出失败，请重试'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }, 'image/png');
}
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); };

/* 只画水贴：透明底、无脸模、不画辅助线（可直接送印） */
function drawDecalsOnly(ctx) {
  ctx.save();
  ctx.translate(view.tx, view.ty);
  ctx.scale(view.z, view.z);
  for (const d of decals) if (d.v) drawDecal(ctx, d);
  ctx.restore();
}

/* 成对水贴板：逐部件单独抠图，左右对称拼版，方便对位与送印 */
function buildPairSheet() {
  const items = decals.filter(d => d.v);
  if (!items.length) return null;
  const CW = 260, CH = 150, PAD = 16, GAPX = 24, GAPY = 26, HEAD = 30, COLS = 2;
  const rows = Math.ceil(items.length / COLS);
  const c = document.createElement('canvas');
  c.width = PAD * 2 + CW * COLS + GAPX * (COLS - 1);
  c.height = HEAD + rows * (CH + GAPY);
  const ctx = c.getContext('2d');
  ctx.fillStyle = COL.paper;
  ctx.fillRect(0, 0, c.width, c.height);

  /* 中轴虚线：提示这是左右成对的版面 */
  const midX = c.width / 2;
  ctx.save();
  ctx.setLineDash([6, 7]);
  ctx.strokeStyle = 'rgba(40,40,44,0.30)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(midX, HEAD - 6); ctx.lineTo(midX, c.height - PAD); ctx.stroke();
  ctx.restore();

  items.forEach((d, i) => {
    const asset = assetOf(d);
    if (!asset) return;
    const col = i % COLS, row = Math.floor(i / COLS);
    const x0 = PAD + col * (CW + GAPX), y0 = HEAD + row * (CH + GAPY);
    const ccx = x0 + CW / 2, ccy = y0 + CH / 2;

    /* 单元格与部件标签 */
    ctx.save();
    ctx.strokeStyle = 'rgba(40,40,44,0.16)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x0 + .5, y0 + .5, CW - 1, CH - 1);
    ctx.fillStyle = 'rgba(40,40,44,0.62)';
    ctx.font = '500 11.5px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'left';
    ctx.fillText(asset.name + (d.f ? ' · 镜像' : ''), x0 + 3, y0 - 5);
    ctx.restore();

    /* 部件：按原始比例居中，保留透明 */
    const img = decalCanvasOf(asset);
    const innerW = asset.w * d.s, innerH = asset.h * d.s;
    const fit = Math.min((CW - 16) / innerW, (CH - 16) / innerH);
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, y0, CW, CH); ctx.clip();
    ctx.translate(ccx, ccy);
    ctx.rotate(d.rot);
    ctx.scale((d.f ? -1 : 1) * d.s * fit, d.s * fit);
    ctx.globalAlpha = d.o;
    ctx.drawImage(img, -asset.w / 2, -asset.h / 2, asset.w, asset.h);
    ctx.restore();
  });
  return c;
}

function loadEmbedBase(src, name, kind, opt) {
  const silent = !!(opt && opt.silent);
  if(!silent){closeEdgeEditor();commit();pendingHoles=null;$('#sheet').classList.remove('open');}
  const loadId=++baseLoadVersion;
  const img = new Image();
  img.onload = () => {
    if(loadId!==baseLoadVersion)return;
    afterBaseReady(img);              // 自动检测 → 失败则用已保存的手动眼孔
    basePhoto = img; baseKind = kind || 'sketch'; baseSrc = null;
    reanchorEyes();
    loadedBaseHistory(silent);
    if (!silent) toast('已载入' + name + (img._holes.ok ? '' : ' · 未认出眼窝，可用「点选眼窝」'));
    requestRender();

/* v13：上传眼珠 → 四边播种洪泛去底（v14a：只从 4 角播种会被渐变/暗角挡住去不了另一侧，
   白底照片的阴影残留把整块背景连着眼珠留下 —— 从四边全部像素播种后独立区域各自可达）
   → 按连通域拆件（成对图自动拆左右，水印/杂点按面积比丢弃）→ 裁到内容包围盒 */
function floodCutBg(src, tol) {
  const W = src.width, H = src.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, 0, 0);
  const idata = x.getImageData(0, 0, W, H), p = idata.data;
  const idx = (px, py) => (py * W + px) * 4;
  const cs = [idx(2, 2), idx(W - 3, 2), idx(2, H - 3), idx(W - 3, H - 3)];
  const key = [0, 1, 2].map(i => {
    const vs = cs.map(k => p[k + i]).sort((a, b) => a - b);
    return (vs[1] + vs[2]) / 2;
  });
  const nearKey = i => Math.abs(p[i] - key[0]) <= tol && Math.abs(p[i + 1] - key[1]) <= tol && Math.abs(p[i + 2] - key[2]) <= tol;
  const seen = new Uint8Array(W * H);
  const st = [];
  const seed = (sx, sy) => { const k = sy * W + sx; if (!seen[k]) { seen[k] = 1; st.push(k); } };
  for (let sx = 0; sx < W; sx++) { seed(sx, 0); seed(sx, H - 1); }
  for (let sy = 0; sy < H; sy++) { seed(0, sy); seed(W - 1, sy); }
  while (st.length) {
    const k = st.pop();
    const i = k * 4;
    if (nearKey(i)) p[i + 3] = 0;                     // 只抠真的是背景色的像素
    const cx = k % W, cy = (k / W) | 0;
    for (const [nx, ny] of [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]]) {
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      const nk = ny * W + nx;
      if (seen[nk]) continue;
      if (nearKey(nk * 4)) { seen[nk] = 1; st.push(nk); }
    }
  }
  x.putImageData(idata, 0, 0);
  return c;
}
/* 拆连通域：返回面积 ≥ 主件 keepFrac 的组件（按 x 从左到右），各自裁成独立 canvas。
   单件图返回 1 个；成对图返回 2 个；水印/杂点自动落选 */
function isolateParts(src, keepFrac) {
  const W = src.width, H = src.height;
  const x = src.getContext('2d', { willReadFrequently: true });
  const idata = x.getImageData(0, 0, W, H), p = idata.data;
  const op = k => p[k * 4 + 3] > 10;
  const seen = new Uint8Array(W * H);
  const comps = [];
  for (let sy = 0; sy < H; sy++) for (let sx = 0; sx < W; sx++) {
    const k = sy * W + sx;
    if (seen[k] || !op(k)) continue;
    const st = [k]; seen[k] = 1;
    let n = 0, x0 = sx, x1 = sx, y0 = sy, y1 = sy;
    const cc = [];
    while (st.length) {
      const cur = st.pop(); cc.push(cur); n++;
      const cx = cur % W, cy = (cur / W) | 0;
      if (cx < x0) x0 = cx; if (cx > x1) x1 = cx;
      if (cy < y0) y0 = cy; if (cy > y1) y1 = cy;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = cx + dx, ny = cy + dy;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        const nk = ny * W + nx;
        if (seen[nk] || !op(nk)) continue;
        seen[nk] = 1; st.push(nk);
      }
    }
    comps.push({ n, x0, x1, y0, y1, cc });
  }
  if (!comps.length) return [];
  comps.sort((a, b) => b.n - a.n);
  const kept = comps.filter(c => c.n >= comps[0].n * (keepFrac || 0.25)).sort((a, b) => a.x0 - b.x0);
  const keep = new Uint8Array(W * H);
  for (const c of kept) for (const k of c.cc) keep[k] = 1;
  for (let k = 0; k < W * H; k++) if (!keep[k]) p[k * 4 + 3] = 0;
  x.putImageData(idata, 0, 0);
  return kept.map(c => {
    const bw = c.x1 - c.x0 + 1, bh = c.y1 - c.y0 + 1;
    const c2 = document.createElement('canvas'); c2.width = bw; c2.height = bh;
    c2.getContext('2d').drawImage(src, c.x0, c.y0, bw, bh, 0, 0, bw, bh);
    return c2;
  });
}
$('#eyeFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const MAX = 640;
    const k = Math.min(1, MAX / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(2, Math.round(img.width * k)); c.height = Math.max(2, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const parts = isolateParts(floodCutBg(c, 26), 0.25).filter(b => b.width >= 12 && b.height >= 12);
    if (!parts.length) {
      toast('没认出眼珠主体 · 试试白底/纯色底的图');
      return;
    }
    const baseName = f.name.replace(/\.[^.]+$/, '').slice(0, 12) || '自定义眼珠';
    const mkAsset = (ball, suffix) => {
      let src = null;
      try { src = ball.toDataURL('image/png'); } catch (err) {}
      return { id: 'eyec' + (++eyeCustomSeq), name: baseName + suffix, src, img: ball };
    };
    let assets;
    if (parts.length === 1) {
      assets = [mkAsset(parts[0], '')];
    } else {
      /* 成对图（左右两只）：左图戴左眼、右图戴右眼，不镜像（螺旋等手性纹路镜像会穿帮） */
      const suffix = parts.length === 2 ? ['·左', '·右'] : parts.map((_, i) => '·' + (i + 1));
      assets = parts.map((ball, i) => mkAsset(ball, suffix[i]));
    }
    if (assets.length === 2) {
      assets[0].pairId = assets[1].pairId = assets[0].id;
      assets[0].side = 0; assets[1].side = 1;
    }
    for (const a of assets) EYE_CUSTOM.unshift(a);
    saveEyeAssets();
    wearCustomEyes(assets[0], assets[1] || null);
    if (assets.length > 1) toast('认出 ' + assets.length + ' 只眼珠 · 已成对戴上（左图戴左眼）');
    renderDrawer();
    openEyeSheet();
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
});
/* 戴自定义眼珠：左右各一枚（assetR 省略 = 两眼同图），垫在脸模之下（眼孔抠空时自动从孔里透出） */
function wearCustomEyes(asset, assetR) {
  if (!asset) return;
  if (!assetR && asset.pairId) {
    const pair = EYE_CUSTOM.filter(a => a.pairId === asset.pairId);
    const left = pair.find(a => a.side === 0), right = pair.find(a => a.side === 1);
    if (left && right) { asset = left; assetR = right; }
  }
  decals = decals.filter(d => !isEyeDecal(d));
  let first = null;
  for (const side of [0, 1]) {
    const a = (side === 1 && assetR) ? assetR : asset;
    const g = socketGeom(side);
    const d = {
      id: 'd' + (uidSeq++), a: 'eyec:' + a.id,
      x: g.x, y: g.y, rot: 0, s: 1, f: false, o: 1, b: 'source-over', v: true,
      e: { side, gap: 0, manual: false },
    };
    decals.push(d);
    if (!first) first = d;
  }
  selectedId = first.id;
  commit(); syncControls(); renderLayers();
  toast(holesReady() ? '已戴上「' + asset.name + (assetR ? ' ×2' : '') + '」· 从眼孔透出' : '已戴上「' + asset.name + (assetR ? ' ×2' : '') + '」· 未检出眼孔按眼窝叠加，可到「素头与底图 → 点选眼窝」抠空');
}

}
function customEyeGroupName(members) {

/* 戴/换眼珠：已有眼珠则整套换色，否则在左右眼窝各放一枚 */
function wearEyes(sid) {
  const st = EYE_STYLES[sid];
  if (!st) return;
  const ex = eyeDecals();
  if (ex.length) {
    for (const d of ex) { d.a = 'eye:' + sid; if (!d.e) d.e = {}; d.e.vein = st.vein; }
    selectedId = ex[0].id;
    toast('已换为「' + st.name + '」');
  } else {
    let first = null;
    for (const side of [0, 1]) {
      const g = socketGeom(side);
      const d = {
        id: 'd' + (uidSeq++), a: 'eye:' + sid,
        x: g.x, y: g.y, rot: g.rot, s: 1, f: false, o: 1, b: 'source-over', v: true,
        e: { pupil: 0.27, exp: 0, gaze: 0, hl: 215, vein: st.vein, putty: 0.5, side, gap: 0, manual: false },
      };
      decals.push(d);
      if (!first) first = d;
    }
    selectedId = first.id;
    toast('已佩戴双眼「' + st.name + '」· 可拖拽微调');
  }
  commit(); syncControls(); renderLayers();
  closeDrawer();
  openEyeSheet();
}

function realignEyes() {

  ex.forEach((d, i) => {
    const side = (d.e && d.e.side !== undefined) ? d.e.side : i;
    const g = socketGeom(side);
    d.x = g.x; d.y = g.y; d.rot = isCustomEyeDecal(d) ? 0 : g.rot;

const EYE_BIND = [

  ['erGaze',  'gaze',  'evGaze',  v => (v > 0 ? '+' : '') + v.toFixed(2)],
  ['erGap',   'gap',   'evGap',   v => Math.round(v) + 'px'],
  ['erHl',    'hl',    'evHl',    v => Math.round(v) + '\u00B0'],

  ['erPutty', 'putty', 'evPutty', v => Math.round(v * 100) + '%'],

function eyeSideOf(d, i) { return (d.e && d.e.side !== undefined) ? d.e.side : i; }
function currentEyeGap() {
  const ex = eyeDecals();
  if (!ex.length) return 0;

  'brow-l':'左眉','brow-r':'右眉','eye-l':'左眼','eye-r':'右眼','nose':'鼻子',

/* 上脸锚点：xf/yf 为相对素头矩形的比例偏移，wf 为部件目标宽度占比
   （按线稿五官几何定标：眉脊 ±0.125@0.415，眼 ±0.115@0.44，唇 0@0.578，腮 ±0.15@0.545） */
const ROLE_ANCHOR = {
  'brow-l':{xf:-0.125, yf:0.415, wf:0.22, rot:-2.5}, 'brow-r':{xf: 0.125, yf:0.415, wf:0.22, rot:-2.5},
  'eye-l': {xf:-0.115, yf:0.440, wf:0.18},           'eye-r': {xf: 0.115, yf:0.440, wf:0.18},
  'nose':  {xf: 0,     yf:0.495, wf:0.09},
  'mouth': {xf: 0,     yf:0.578, wf:0.145},
  'blush-l':{xf:-0.150, yf:0.545, wf:0.22},          'blush-r':{xf: 0.150, yf:0.545, wf:0.22},
  'mark':  {xf: 0,     yf:0.300, wf:0.09},
  'other': {xf: 0,     yf:0.500, wf:0.13},
};
function guessRole(cx, cy) {
  if (cy < 0.28)  return Math.abs(cx - 0.5) < 0.10 ? 'mark' : (cx < 0.5 ? 'brow-l' : 'brow-r');
  if (cy < 0.455) return cx < 0.5 ? 'eye-l' : 'eye-r';
  if (cy < 0.55)  return Math.abs(cx - 0.5) < 0.17 ? 'nose' : (cx < 0.5 ? 'blush-l' : 'blush-r');
  if (cy < 0.68)  return 'mouth';
  return 'other';
}
function partAssetId(gid, i) { return 'gp_' + gid + '_' + i; }
function partKind(role) {
  if (role === 'blush-l' || role === 'blush-r') return 'blush';
  if (role === 'mouth') return 'lip';
  if ((role || '').indexOf('brow') === 0) return 'brow';
  return 'custom';
}
function registerGroupAssets(g) {

  const N = W * H;

  for (let i = 3; i < data.length; i += 4 * 31) { if (data[i] < 250) { hasAlpha = true; break; } }
  let bgL = 255;

    let sum = 0, n = 0;
    for (const q of [[0,0],[W-1,0],[0,H-1],[W-1,H-1]]) {

    else {

/* 8 邻域连通域（非递归洪水填充） */

      if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;

        const r = ny * W + nx;
        if (mask[r] && !lab[r]) { lab[r] = id; stack.push(r); }

/* 合并几乎贴在一起的碎块（虚线笔画等） */

    for (const o of out) {
      const ix0 = Math.max(b.x0 - 3, o.x0 - 3), ix1 = Math.min(b.x1 + 3, o.x1 + 3);
      const iy0 = Math.max(b.y0 - 3, o.y0 - 3), iy1 = Math.min(b.y1 + 3, o.y1 + 3);
      if (ix1 >= ix0 && iy1 >= iy0) {

        if (ia / Math.min(b.area, o.area) > 0.35) { hit = o; break; }

  ['eye-l',  0.08, 0.375, 0.44, 0.470], ['eye-r',  0.56, 0.375, 0.92, 0.470],
  ['nose',   0.40, 0.470, 0.60, 0.555],
  ['blush-l',0.10, 0.480, 0.36, 0.600], ['blush-r',0.64, 0.480, 0.90, 0.600],

      const gy0 = Math.max(0, Math.round(d[2] * H)), gy1 = Math.min(H - 1, Math.round(d[4] * H));

      const x0 = bb ? Math.max(0, bb.x0 - 2) : gx0, y0 = bb ? Math.max(0, bb.y0 - 2) : gy0;
      const x1 = bb ? Math.min(W - 1, bb.x1 + 2) : gx1, y1 = bb ? Math.min(H - 1, bb.y1 + 2) : gy1;

    };
  });

}

/* ---------------- 内联命名 / 确认面板 ----------------

    b.style.left = (p.x / sp.W * 100) + '%';

function boxDown(e, i, boxEl) {

  renderBoxes(); renderChips(); syncSpInfo();
});
$('#spMode').addEventListener('click', () => {
  if (!sp) return;
  const next = sp.mode === 'region' ? 'cc' : 'region';
  const res = analyze(next, sp.canvas, inkMask(sp.canvas));
  nameParts(res.parts);
  sp.mode = res.mode;
  sp.parts = res.parts;
  sp.sel = Math.min(sp.sel, Math.max(0, sp.parts.length - 1));
  renderBoxes(); renderChips(); syncSpInfo();
  toast(sp.mode === 'region' ? '已切换为脸区兜底切分' : '已切换为连通域分割');
});
addEventListener('resize', () => { if (sp && spEl.classList.contains('open')) fitSheet(); });

/* ---------------- AI placeholder ---------------- */
$('#aiBtn').addEventListener('click', () =>
  toast('AI 锚点识别 \u00B7 三期规划'));

/* ---------------- toast ---------------- */
let toastT = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 1700);
}

/* ---------------- keyboard (desktop) ---------------- */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const d = sel();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    e.shiftKey ? redo() : undo();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
  if (!d) return;
  const step = e.shiftKey ? 2 : 0.5;
  switch (e.key) {
    case 'ArrowLeft':  d.x -= step; break;
    case 'ArrowRight': d.x += step; break;
    case 'ArrowUp':    d.y -= step; break;
    case 'ArrowDown':  d.y += step; break;
    case '[': d.rot -= 0.5 * RAD; $('#angVal').textContent = fmtDeg(d.rot); break;
    case ']': d.rot += 0.5 * RAD; $('#angVal').textContent = fmtDeg(d.rot); break;
    case 'Backspace': case 'Delete': removeDecal(d.id); break;
    default: return;
  }
  e.preventDefault();
  requestRender();
});

/* ---------------- boot ---------------- */
function fitFrame() {
  const app = document.getElementById('app');
  if (!matchMedia('(min-width:700px)').matches) { app.style.transform = ''; return; }
  const s = Math.min(1, (innerHeight - 24) / 844, (innerWidth - 24) / 390);
  app.style.transformOrigin = 'center center';
  app.style.transform = s < 1 ? 'scale(' + s + ')' : '';
}
addEventListener('resize', fitFrame);
fitFrame();

renderTabs();
renderFilters();
renderDrawer();
/* =====================================================================
   方案持久化：自动保存 + 多方案（localStorage）
   ===================================================================== */
const LS_KEY = 'bjd-decal-studio.v1';
const BASE_LABEL = { sketch: '线稿', 'embed-default': '默认脸模', 'embed-anan': '安安', upload: '上传底图' };
let baseKind = 'sketch';     // sketch | embed-default | embed-anan | upload
let baseSrc = null;          // 上传底图的 dataURL，随方案一起保存
let projects = [];
let currentProj = null;
let saveT = null;

const projId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const projNameOf = p => (p && p.name) ? p.name : '未命名方案';
function fmtTime(ts) {
  const d = new Date(ts || Date.now()), p = n => String(n).padStart(2, '0');
  return p(d.getHours()) + ':' + p(d.getMinutes());
}
function collectData() {
  return {
    d: decals.map(d => ({ id: d.id, a: d.a, x: +d.x.toFixed(2), y: +d.y.toFixed(2), rot: +d.rot.toFixed(4),
                          s: +d.s.toFixed(4), f: d.f ? 1 : 0, o: +d.o.toFixed(3), b: d.b, v: d.v ? 1 : 0,
                          e: eyeSerialize(d) })),
    /* 分组部件素材（c.group 有值）随 GROUPS 单独存储，不进方案快照，避免重复占空间 */
    custom: CUSTOM_ASSETS.filter(c => !c.group).map(c => ({ id: c.id, name: c.name, w: c.w, h: c.h, src: c.src || null })),
    sel: selectedId,
    base: (() => {
      /* v13b：眼孔随方案保存（自动或手动检出都存）—— holes 几何 + mask PNG（保持原图分辨率） */
      const f = baseFit(), hs = f.img && f.img._holes;
      let holes = null, maskSrc = null;
      if (hs && hs.ok && hs.holes && hs.holes.length === 2) {
        holes = hs.holes.map(h => ({ cx: +h.cx.toFixed(1), cy: +h.cy.toFixed(1), rx: +h.rx.toFixed(1), ry: +h.ry.toFixed(1),
                                     hw: +(h.hw || h.rx).toFixed(1), hh: +(h.hh || h.ry).toFixed(1) }));
        if (!hs.maskSrc) hs.maskSrc = maskDataURL(hs.mask);
        maskSrc = hs.maskSrc;
      }
      return { kind: baseKind, src: baseKind === 'upload' ? baseSrc : null, holes, maskSrc,
               maskVersion: hs && hs.version || 1, maskSource: hs && hs.source, disabled: !!(hs && hs.why === 'disabled'),
               /* v13c：底图位置（脸壳居中偏移 / 缩放 / 脸壳中心） */
               off: { px: +baseOff.px.toFixed(1), py: +baseOff.py.toFixed(1) },
               zoom: +baseZoom.toFixed(3),
               face: { fx: +baseFace.fx.toFixed(4), fy: +baseFace.fy.toFixed(4) } };
    })(),
    eyeBg,
    view: { z: +view.z.toFixed(3), tx: +view.tx.toFixed(1), ty: +view.ty.toFixed(1) },
    guides: !!guides, uidSeq
  };
}
function markSaved(kind, txt) {
  const el = $('#savedLbl');
  if (!el) return;
  el.className = 'saved-lbl' + (kind === 'ok' ? ' ok' : kind === 'warn' ? ' warn' : '');
  el.textContent = txt;
}
function saveNow() {
  if (!currentProj) return;
  currentProj.data = collectData();
  currentProj.ts = Date.now();
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      v: 1, currentId: currentProj.id, projects,
      /* v13：自定义眼珠素材全局存（跨方案复用），不进方案快照 */
      eyeAssets: EYE_CUSTOM.map(c => ({ id: c.id, name: c.name, src: c.src, pairId: c.pairId, side: c.side, archived: !!c.archived })),
      groups: GROUPS.map(g => ({ id:g.id, name:g.name, ts:g.ts, mode:g.mode, sheet:g.sheet,
        sheetW:g.sheetW, sheetH:g.sheetH,
        parts: g.parts.map(p => ({ name:p.name, role:p.role, x:p.x, y:p.y, w:p.w, h:p.h, src:p.src })) })),
    }));
    markSaved('ok', '已自动保存 · ' + fmtTime(currentProj.ts));
  } catch (err) {
    markSaved('warn', '保存失败：本机存储空间不足');
  }
}
function scheduleSave() { clearTimeout(saveT); saveT = setTimeout(saveNow, 600); }
/* v13：自定义眼珠素材单独落盘（复用整包保存） */
function saveEyeAssets() { scheduleSave(); }
function loadStore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (Array.isArray(o.groups)) {
      GROUPS.length = 0;
      for (const g of o.groups) if (g && Array.isArray(g.parts) && g.parts.length) GROUPS.push(g);
    }
    /* v13：自定义眼珠素材 */
    if (Array.isArray(o.eyeAssets)) {
      EYE_CUSTOM.length = 0;
      for (const a of o.eyeAssets) {
        if (!a || !a.id || !a.src) continue;
        const im = new Image();
        EYE_CUSTOM.push({ id: a.id, name: a.name || '自定义眼珠', src: a.src, img: im, pairId: a.pairId, side: a.side, archived: !!a.archived });
        im.onload = () => requestRender();
        im.src = a.src;
      }
      // Older imports had adjacent numeric IDs and left/right name suffixes.
      // Only migrate unique siblings; ambiguous imports remain independent.
      for (const left of EYE_CUSTOM) {
        if (left.pairId || !left.name.endsWith('·左')) continue;
        const stem = left.name.slice(0, -2);
        const siblings = EYE_CUSTOM.filter(a => a.name === stem + '·左' || a.name === stem + '·右');
        const right = siblings.find(a => a.name === stem + '·右' && !a.pairId);
        const n = /^eyec(\d+)$/.exec(left.id);
        if (siblings.length === 2 && right && n && right.id === 'eyec' + (+n[1] + 1)) {
          left.pairId = right.pairId = left.id; left.side = 0; right.side = 1;
        }
      }
      eyeCustomSeq = Math.max(0, ...EYE_CUSTOM.map(c => parseInt(String(c.id).replace('eyec', ''), 10) || 0));
    }
    return (o && Array.isArray(o.projects) && o.projects.length) ? o : null;
  } catch (err) { return null; }
}
function applyBase(b) {
  closeEdgeEditor();const loadId=++baseLoadVersion;
  baseKind = b.kind || 'sketch';
  baseSrc = b.src || null;
  /* v13c：底图位置随方案恢复 */
  if (b && b.off) { baseOff.px = +b.off.px || 0; baseOff.py = +b.off.py || 0; }
  else { baseOff.px = 0; baseOff.py = 0; }
  baseZoom = (b && +b.zoom) ? +b.zoom : 1;
  if (b && b.face) { baseFace.fx = +b.face.fx || 0.5; baseFace.fy = +b.face.fy || 0.5; }
  else { baseFace.fx = 0.5; baseFace.fy = 0.5; }
  pendingHoles = b && (b.disabled || (Array.isArray(b.holes) && b.holes.length === 2 && b.maskSrc)) ? b : null;
  if (baseKind === 'embed-default') { loadEmbedBase(EMBED_DEFAULT, '默认脸模', 'embed-default', { silent: true }); return; }
  if (baseKind === 'embed-anan') { loadEmbedBase(EMBED_ANAN, '默认脸模-安安', 'embed-anan', { silent: true }); return; }
  if (baseKind === 'upload' && baseSrc) {
    const img = new Image();
    img.onload = () => { if(loadId!==baseLoadVersion)return;afterBaseReady(img); basePhoto = img; reanchorEyes();loadedBaseHistory(true); requestRender(); };
    img.src = baseSrc;
    return;
  }
  basePhoto = null;
  if (headReady) afterBaseReady(headImg);
}
function applyProject(p) {
  closeEdgeEditor();closeEyeSheet();
  currentProj = p;
  const d = p.data || {};
  CUSTOM_ASSETS.length = 0;
  for (const c of (d.custom || [])) {
    if (!c || !c.src) continue;
    const img = new Image(); img.src = c.src;
    CUSTOM_ASSETS.push({ id: c.id, custom: true, img, src: c.src, w: c.w, h: c.h, name: c.name, kind: 'custom', tab: 'brows', cat: '' });
  }
  decals = (d.d || []).map(x => {
    const dd = { id: x.id, a: x.a, x: x.x, y: x.y, rot: x.rot, s: x.s, f: !!x.f, o: x.o, b: x.b, v: !!x.v };
    const e = eyeDeserialize(x.e);
    if (e) dd.e = e;
    return dd;
  });
  selectedId = d.sel && decals.some(x => x.id === d.sel) ? d.sel : null;
  uidSeq = Math.max(1, ...decals.map(x => (parseInt(String(x.id).replace(/\D/g, ''), 10) || 0) + 1));
  customSeq = Math.max(customSeq, ...CUSTOM_ASSETS.map(c => parseInt(String(c.id).replace(/\D/g, ''), 10) || 0));
  for (const g of GROUPS) registerGroupAssets(g);
  if (d.view) { view.z = d.view.z; view.tx = d.view.tx; view.ty = d.view.ty; }
  guides = d.guides !== false;
  eyeBg = d.eyeBg || '#0A0A0C';
  const gb = $('#guideBtn');
  gb.textContent = guides ? '辅助线：开' : '辅助线：关';
  gb.classList.toggle('off', !guides);
  applyBase(d.base || { kind: 'sketch' });
  history.length = 0; history.push(snapshot()); hIdx = 0;
  syncHistoryBtns(); syncControls(); renderLayers(); renderDrawer(); syncTitle();
  requestRender();
  markSaved('ok', '已自动保存 · ' + fmtTime(p.ts || Date.now()));
}
function syncTitle() {
  const el = $('#projName');
  if (el) el.textContent = '/ 方案：' + projNameOf(currentProj);
}
function renderProjList() {
  const list = $('#projList');
  if (!list) return;
  list.innerHTML = '';
  [...projects].sort((a, b) => (b.ts || 0) - (a.ts || 0)).forEach(p => {
    const row = document.createElement('div');
    row.className = 'proj-row' + (currentProj && p.id === currentProj.id ? ' cur' : '');
    const meta = document.createElement('div'); meta.className = 'pmeta';
    const nm = document.createElement('div'); nm.className = 'pname'; nm.textContent = projNameOf(p);
    const sub = document.createElement('div'); sub.className = 'psub';
    const n = (p.data && p.data.d) ? p.data.d.length : 0;
    const bk = (p.data && p.data.base && p.data.base.kind) || 'sketch';
    sub.textContent = n + ' 个水贴 · ' + (BASE_LABEL[bk] || '线稿') + ' · ' + fmtTime(p.ts || 0);
    meta.appendChild(nm); meta.appendChild(sub);
    const ren = document.createElement('button');
    ren.className = 'pact'; ren.title = '重命名';
    ren.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="M14.5 5.5 18.5 9.5"/></svg>';
    ren.addEventListener('click', e => { e.stopPropagation(); renameProject(p.id); });
    const del = document.createElement('button');
    del.className = 'pact'; del.title = '删除';
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M9 7V5h6v2"/><path d="M7 7l1 12h8l1-12"/></svg>';
    del.addEventListener('click', e => { e.stopPropagation(); deleteProject(p.id); });
    row.appendChild(meta); row.appendChild(ren); row.appendChild(del);
    row.addEventListener('click', () => switchProject(p.id));
    list.appendChild(row);
  });
}
function switchProject(id) {
  if (currentProj && id !== currentProj.id) saveNow();
  const p = projects.find(x => x.id === id);
  if (!p) return;
  applyProject(p);
  renderProjList();
  $('#sheet').classList.remove('open');
  toast('已切换到「' + projNameOf(p) + '」');
}
function newProject(name) {
  closeEdgeEditor();closeEyeSheet();baseLoadVersion++;
  const nm = (name || '').trim() || ('新方案 ' + (projects.length + 1));
  const p = { id: projId(), name: nm, ts: Date.now(), data: null };
  projects.push(p);
  decals = []; selectedId = null; CUSTOM_ASSETS.length = 0;
  baseKind = 'sketch'; baseSrc = null; basePhoto = null;
  clearBaseHoles();
  baseOff.px = 0; baseOff.py = 0; baseZoom = 1; baseFace.fx = 0.5; baseFace.fy = 0.5;
  baseAdj = null; pickEye = null;
  eyeBg = '#0A0A0C';
  view.z = 1; view.tx = 0; view.ty = 0;
  history.length = 0;
  currentProj = p;
  commit();
  renderProjList(); syncTitle();
  toast('已新建「' + nm + '」');
}
async function renameProject(id) {
  const p = projects.find(x => x.id === id);
  if (!p) return;
  const nm = await askText('方案名称', projNameOf(p), '例如：春日');
  if (nm === null) return;
  p.name = nm.trim() || projNameOf(p);
  p.ts = Date.now();
  saveNow(); renderProjList(); syncTitle();
}
async function deleteProject(id) {
  if (projects.length <= 1) { toast('至少保留一个方案'); return; }
  const p = projects.find(x => x.id === id);
  if (!p) return;
  if (!await askSure('删除方案「' + projNameOf(p) + '」？该方案的水贴会一起删除。', '删除方案')) return;
  projects = projects.filter(x => x.id !== id);
  if (currentProj && currentProj.id === id) applyProject(projects[0]);
  saveNow(); renderProjList(); syncTitle();
  toast('方案已删除');
}
$('#newProjBtn').addEventListener('click', async () => {
  const nm = await askText('新方案名称', '新方案 ' + (projects.length + 1), '例如：春日');
  if (nm === null) return;
  newProject(nm);
  $('#sheet').classList.remove('open');
});
$('#projectBtn').addEventListener('click', () => renderProjList());
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });

/* ---------------- init ---------------- */
const store = loadStore();
if (store) {
  projects = store.projects;
  applyProject(projects.find(p => p.id === store.currentId) || projects[0]);
} else {
  newProject('春日');
  openDrawer();
  addDecal('classical', { x: vw / 2 - 46, y: headRect().y + headRect().h * 0.395, rot: -2.5 * RAD, s: 0.4, o: 0.85, b: 'multiply' });
  commit();
}
renderProjList();
syncTitle();
syncHistoryBtns();
syncControls();
requestRender();
</script>
